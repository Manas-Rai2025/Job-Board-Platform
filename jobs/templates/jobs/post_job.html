<!DOCTYPE html>
<html>
<head>

    <title>Post a Job | JobBoard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #111827;
            padding: 20px 8%;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .container {
            max-width: 750px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .form-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .required {
            color: #dc2626;
        }

    </style>

</head>

<body>

<nav>

    <h2>JobBoard</h2>

    <a href="{% url 'job_list' %}">
        View Jobs
    </a>

</nav>


<div class="container">

    <a href="{% url 'job_list' %}" class="back">
        ← Back to Jobs
    </a>


    <div class="form-box">

        <h1>Post a Job</h1>

        <p class="subtitle">
            Create a new job opportunity and connect with talented candidates.
        </p>


        <form method="POST">

            {% csrf_token %}


            <label for="title">
                Job Title <span class="required">*</span>
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Python Developer"
                required
            >


            <label for="company">
                Company <span class="required">*</span>
            </label>

            <input
                type="text"
                id="company"
                name="company"
                placeholder="e.g. TechNova Solutions"
                required
            >


            <label for="location">
                Location <span class="required">*</span>
            </label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="e.g. Noida, India"
                required
            >


            <label for="salary">
                Salary <span class="required">*</span>
            </label>

            <input
                type="text"
                id="salary"
                name="salary"
                placeholder="e.g. ₹6 - ₹10 LPA"
                required
            >


            <label for="description">
                Job Description <span class="required">*</span>
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Describe the job responsibilities, requirements, skills and qualifications..."
                required
            ></textarea>


            <button type="submit">
                🚀 Post Job
            </button>

        </form>

    </div>

</div>

</body>
</html>
