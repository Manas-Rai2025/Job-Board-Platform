<!DOCTYPE html>
<html>
<head>
    <title>Application Submitted</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .success-box {
            background: white;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        .icon {
            font-size: 60px;
        }

        h1 {
            color: #16a34a;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="icon">✅</div>

    <h1>Application Submitted!</h1>

    <p>
        Your application for
        <strong>{{ job.title }}</strong>
        has been successfully submitted.
    </p>

    <p>
        The employer will review your application.
    </p>

    <a href="{% url 'job_list' %}">
        Browse More Jobs
    </a>

</div>

</body>
</html>
